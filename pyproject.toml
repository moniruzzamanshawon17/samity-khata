[project]
name = "samity-khata"
version = "0.1.0"
description = "Ledger, loans and bilingual bylaw assistant for village savings samities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]